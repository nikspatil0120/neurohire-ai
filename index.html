<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeuroHire AI - Next-Gen AI Recruitment Platform</title>
    <meta name="description" content="AI-powered recruitment platform with adaptive interviews, emotion detection, and predictive analytics." />
    <meta name="author" content="NeuroHire AI" />
    <meta property="og:title" content="NeuroHire AI" />
    <meta property="og:description" content="Next-generation AI recruitment platform" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="/neurohire-symbol.png" />
    <link rel="apple-touch-icon" href="/neurohire-symbol.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('neurohire-theme');
          if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
